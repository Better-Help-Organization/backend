# Basic coturn config for Docker/NAT
listening-port=3478
tls-listening-port=5349
fingerprint
use-auth-secret
static-auth-secret=turn-secret
realm=navigo.et
# user=testuser:testpassword
total-quota=100
bps-capacity=0
stale-nonce=600
cert=/etc/ssl/certs/turnserver-cert.pem
pkey=/etc/ssl/private/turnserver-key.pem
cipher-list="ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256"
no-loopback-peers
no-multicast-peers

external-ip=91.99.145.21
# listening-ip=172.18.0.9
# relay-ip=172.18.0.9
# Uncomment and set your public/private IPs above
# For example: external-ip=203.0.113.1/172.18.0.2
# Adjust cert/pkey paths if using TLS
# Add more options as needed for your deployment
