logging:
  logs:
    default:
      level: INFO
storage:
  "module": "file_system"
  "root": "/data"
apps:
  tls:
    certificates:
      automate:
        - livekit.navigo.et
        - turn.navigo.et
        - livekit-whip.navigo.et
        - app.navigo.et
        - php.navigo.et

  http:
    servers:
      http:
        listen: [":80"]
        routes:
          - handle:
              - handler: static_response
                status_code: 308
                headers:
                  Location: ["https://{http.request.host}{http.request.uri}"]
      web:
        listen: [":443"]
        routes:
          - match:
              - host: ["app.navigo.et", "app.localhost"]
                path: ["/dev*"]
            handle:
              - handler: subroute
                routes:
                  - handle:
                      - handler: rewrite
                        strip_path_prefix: /dev
              - handler: reverse_proxy
                upstreams:
                  - dial: "app:3000"

          - match:
              - host: ["php.navigo.et", "php.localhost"]
                # path: ["/dev*"]
            handle:
              # - handler: subroute
              #   routes:
              #     - handle:
              #         - handler: rewrite
              #           strip_path_prefix: /dev
              - handler: reverse_proxy
                upstreams:
                  - dial: "localhost:8091"

  layer4:
    servers:
      main:
        listen: [":443"]
        routes:
          - match:
            - tls:
                sni:
                  - "turn.navigo.et"
            handle:
              - handler: tls
              - handler: proxy
                upstreams:
                  - dial: ["localhost:5349"]
          - match:
              - tls:
                  sni:
                    - "livekit.navigo.et"
            handle:
              - handler: tls
                connection_policies:
                  - alpn: ["http/1.1"]
              - handler: proxy
                upstreams:
                  - dial: ["localhost:7880"]
          - match:
              - tls:
                  sni:
                    - "livekit-whip.navigo.et"
            handle:
              - handler: tls
                connection_policies:
                  - alpn: ["http/1.1"]
              - handler: proxy
                upstreams:
                  - dial: ["localhost:8080"]
