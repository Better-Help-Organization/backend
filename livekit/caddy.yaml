logging:
  logs:
    default:
      level: INFO
storage:
  "module": "file_system"
  "root": "/data"
apps:
  tls:
    certificates:
      automate:
        - livekit.navigo.et
        - turn.navigo.et
        - livekit-whip.navigo.et
  http:
    servers:
      http:
        listen: [":8080"]
        routes:
          - handle:
              - handler: static_response
                status_code: 308
                headers:
                  Location: ["https://{http.request.host}{http.request.uri}"]

  layer4:
    servers:
      main:
        listen: [":8443"]
        routes:
          - match:
            - tls:
                sni:
                  - "turn.navigo.et"
            handle:
              - handler: tls
              - handler: proxy
                upstreams:
                  - dial: ["turnserver:5349"]
          - match:
              - tls:
                  sni:
                    - "livekit.navigo.et"
            handle:
              - handler: tls
                connection_policies:
                  # Allow both HTTP and ACME during issuance
                  - alpn: ["http/1.1"]
              - handler: proxy
                upstreams:
                  - dial: ["livekit:7880"]
          - match:
              - tls:
                  sni:
                    - "livekit-whip.navigo.et"
            handle:
              - handler: tls
                connection_policies:
                  - alpn: ["http/1.1"]
              - handler: proxy
                upstreams:
                  - dial: ["livekit-whip:8080"]
