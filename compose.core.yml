services:
  traefik:
    image: traefik:v2.10
    container_name: proxy
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
      - "5349:5349"  # Directly expose port 5349
    networks:
    # DONOT CHANGE THESE VALUES
      - dev_default
      - prod_default
      - test_default
    restart: unless-stopped
    command:
      - "--log.level=DEBUG"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # cert
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=tibesolomon7@gmail.com"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
      - "--ping.manualrouting=true"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - traefik-data:/data
      # cert
      - letsencrypt:/letsencrypt
    labels:
      - "traefik.enable=true"

networks:
# DONOT CHANGE THESE VALUES
  dev_default:
    external: true
    name: dev_default
  prod_default:
    external: true
    name: prod_default
  test_default:
    external: true
    name: test_default

volumes:
  traefik-data:
    driver: local
  # cert
  letsencrypt:
    driver: local